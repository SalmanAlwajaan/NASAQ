<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نَسَق، المتجر</title>
<meta name="description" content="اختر جهازك: مدار أو سلمى. اضغط على الجهاز تشوف تفاصيله ثم اطلب ويوصلك رد على إيميلك.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<script src="js/logo.js" defer></script>
<style>
.shop{min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;padding:72px 0 96px;text-align:center}
.shop h1{font-size:clamp(44px,6.5vw,84px);font-weight:900;margin-bottom:14px}
.shop .lead{margin:0 auto 56px;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:1020px;margin:0 auto;width:100%}
.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:right;cursor:pointer;padding:0;font:inherit;color:inherit;display:block;width:100%;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
.product:hover{border-color:var(--accent);box-shadow:0 24px 50px var(--shadow);transform:translateY(-6px)}
.product:active{transform:translateY(-2px) scale(.99);transition-duration:.12s}
.product .img img{transition:transform .8s var(--ease)}
.product:hover .img img{transform:scale(1.04)}
.product .more{transition:gap .3s}
.product .more::after{content:"←";display:inline-block;margin-inline-start:6px;transition:transform .3s var(--ease)}
.product:hover .more::after{transform:translateX(-4px)}
.product .img{aspect-ratio:4/3;background:var(--bg);overflow:hidden}
.product .img .dark{display:none}
:root[data-theme="dark"] .product .img .light{display:none}
:root[data-theme="dark"] .product .img .dark{display:block}
:root[data-theme="dark"] .product .img{background:var(--bg-2)}
.product .tag{display:inline-block;margin:0 28px 10px;font-family:var(--sans);font-weight:500;font-size:13.5px;padding:4px 10px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.product .img img{width:100%;height:100%;object-fit:cover;display:block}
.product .info{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:24px 28px 8px}
.product .info h3{font-size:40px;font-weight:900;margin:0}
.product .price{font-family:var(--display);font-weight:300;font-size:32px;font-feature-settings:"salt" 1,"lnum" 1;white-space:nowrap}
.product .desc{padding:0 28px 20px;font-family:var(--text);font-size:17px;color:var(--fg-2);line-height:1.7;margin:0}
.product .more{display:block;padding:0 28px 26px;font-family:var(--sans);font-weight:500;font-size:15px;color:var(--accent)}
@media (max-width:720px){.products{grid-template-columns:1fr}.shop{padding:48px 0 72px}}

/* نافذة التفاصيل */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(31,45,48,.5);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.modal.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.modal .box{background:var(--bg);border-radius:20px;max-width:980px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;
  box-shadow:0 40px 100px rgba(0,0,0,.3);transform:translateY(24px) scale(.97);transition:transform .45s var(--ease)}
.modal.open .box{transform:none}
.modal .img{background:var(--bg);min-height:380px;position:relative}
:root[data-theme="dark"] .modal .img{background:var(--bg-2)}
.modal .img canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.modal .img .hint{position:absolute;inset-inline-end:14px;inset-block-start:12px;font-family:var(--sans);font-weight:300;font-size:13px;color:var(--fg-2);pointer-events:none}
.modal .img.failed::after{content:"العرض ثلاثي الأبعاد يحتاج WebGL2";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg-2);font-family:var(--sans)}
.modal .img img{width:100%;height:100%;object-fit:cover;display:block}
.modal .body{padding:36px 36px 30px;text-align:right}
.modal .body h3{font-size:50px;font-weight:900;margin:0 0 4px}
.modal .body .price{font-family:var(--display);font-weight:300;font-size:36px;margin-bottom:16px;font-feature-settings:"salt" 1,"lnum" 1}
.modal .body p{font-size:18px;margin-bottom:16px}
.modal .body .tag{display:inline-block;margin:0 0 12px;font-family:var(--sans);font-weight:500;font-size:13.5px;padding:4px 10px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.specs{width:100%;border-collapse:collapse;margin:0 0 26px;font-family:var(--sans);font-size:15.5px}
.specs td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.specs td:first-child{font-weight:700;width:34%;color:var(--fg-2)}
.swatches{display:flex;align-items:center;gap:10px;margin:0 0 26px;font-family:var(--sans);font-size:15px}
.swatches .lbl{color:var(--fg-2);margin-inline-end:4px}
.swatches button{position:relative;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;padding:0;background:var(--c1);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.swatches button::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--c2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.swatches button:hover{transform:translateY(-2px) scale(1.06)}
.swatches button.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 0 0 2px var(--bg),0 0 0 4px var(--accent);transform:scale(1.06)}
.swatches .cur{font-weight:500;color:var(--fg);min-width:5ch}
.modal .close{position:absolute;inset-inline-start:14px;inset-block-start:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:22px;line-height:1;z-index:2;
  transition:transform .3s var(--ease),border-color .25s}
.modal .close:hover{border-color:var(--accent);transform:rotate(90deg)}
@media (max-width:720px){.modal .box{grid-template-columns:1fr}.modal .img{min-height:220px}.modal .body{padding:28px 22px}.modal .body h3{font-size:40px}}
</style>
</head>
<body data-title="title.shop">

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="نَسَق، الصفحة الرئيسية" data-i18n-aria="brand.aria">
      <svg class="orbit-mark" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse class="ring" cx="20" cy="20" rx="17" ry="6.5" transform="rotate(-28 20 20)" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".7"/>
        <circle cx="20" cy="20" r="8.6" fill="currentColor"/>
        <circle cx="20" cy="20" r="4.4" fill="none" stroke="var(--bg)" stroke-width="1" opacity=".6"/>
        <g class="sat"><rect x="-3.4" y="-2.3" width="6.8" height="4.6" rx="1.8" fill="var(--mid)"/><circle cx="0" cy="-2.1" r="1.6" fill="currentColor"/></g>
      </svg>
      <span class="name">نَسَق</span>
    </a>
    <nav class="nav" aria-label="أقسام الموقع">
      <a href="index.html#madar" data-i18n="nav.madar">مدار</a>
      <a href="index.html#salma" data-i18n="nav.salma">سلمى</a>
      <a href="index.html#journey" data-i18n="nav.journey">الرحلة</a>
      <a href="index.html#software" data-i18n="nav.software">البرامج</a>
      <a class="cta" href="shop.html" data-i18n="nav.shop">المتجر</a>
    </nav>
    <div class="tools">
      <button class="icon-btn lang-btn" id="langBtn" type="button" aria-label="Switch to English">EN</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي" data-i18n-aria="theme.aria">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="القائمة" data-i18n-aria="menu.aria" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="shop">
  <div class="wrap">
    <h1 class="fatha-3 reveal" data-i18n="shop.h1">اطلُب نسخَـــتك</h1>
    <p class="lead" data-i18n="shop.lead">اختر الجهاز اللي يناسبك، واضغط عليه تشوف تفاصيله، ثم اطلب ويوصلك رد مني على إيميلك.</p>
    <div class="products">
      <button class="product reveal" type="button" data-model="madar">
        <div class="img"><img class="light" src="img/product-madar-light.png" alt="جهاز مدار" data-i18n-alt="shop.img.madar" width="1200" height="900"><img class="dark" src="img/product-madar-dark.png" alt="" width="1200" height="900"></div>
        <div class="info"><h3 data-i18n="nav.madar">مدار</h3><span class="price">249 ر.س</span></div>
        <div class="tag" data-p="madar" data-f="tag">للمصممين والطلاب</div>
        <p class="desc" data-p="madar" data-f="desc">الإصدار الأساسي. مقبض واحد يتحكم بالدوران والتحريك والتقريب، ومفتاحان قابلان للبرمجة.</p>
        <span class="more" data-i18n="shop.more">التفاصيل والطلب</span>
      </button>
      <button class="product reveal d1" type="button" data-model="salma">
        <div class="img"><img class="light" src="img/product-salma-light.png" alt="جهاز سلمى" data-i18n-alt="shop.img.salma" width="1200" height="900"><img class="dark" src="img/product-salma-dark.png" alt="" width="1200" height="900"></div>
        <div class="info"><h3 data-i18n="nav.salma">سلمى</h3><span class="price">399 ر.س</span></div>
        <div class="tag" data-p="salma" data-f="tag">للمصممين المحترفين</div>
        <p class="desc" data-p="salma" data-f="desc">الإصدار الاحترافي. حساسات أكثر وأدق، وبطارية أكبر، واستجابة أسرع لأصغر حركة.</p>
        <span class="more" data-i18n="shop.more">التفاصيل والطلب</span>
      </button>
    </div>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <button class="close" type="button" aria-label="إغلاق" data-i18n-aria="shop.close" id="mClose">&times;</button>
    <div class="img" id="mView"><div class="hint" data-i18n="shop.hint">اسحب للدوران</div></div>
    <div class="body">
      <h3 id="mTitle"></h3>
      <div class="price" id="mPrice"></div>
      <div class="tag" id="mTag"></div>
      <p id="mDesc"></p>
      <table class="specs" id="mSpecs"></table>
      <div class="swatches" id="mColors"><span class="lbl" data-i18n="shop.color">اللون</span></div>
      <a class="btn big" id="mOrder" href="order.html">اطلب</a>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span><span data-i18n="footer.tag">نَسَق: مدار وسلمى، فأرتان ثلاثيتا الأبعاد.</span> <small style="opacity:.6">v13</small></span>
    <nav>
      <a href="terms.html" data-i18n="footer.terms">الشروط والأحكام</a>
      <a href="privacy.html" data-i18n="footer.privacy">سياسة الخصوصية</a>
      <a href="index.html" data-i18n="footer.home">الصفحة الرئيسية</a>
    </nav>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/stage.js"></script>
<script src="js/productview.js"></script>
<script>
(function () {
  var modal = document.getElementById('modal');
  var view = null, current = null, color = 'طبيعي';
  var SW = window.PRODUCT_COLORS;
  var sw = document.getElementById('mColors');
  var cur = document.createElement('span'); cur.className = 'cur';
  Object.keys(SW).forEach(function (n) {
    var b = document.createElement('button'); b.type = 'button'; b.title = n; b.setAttribute('aria-label', n);
    b.style.setProperty('--c1', SW[n].hex.body); b.style.setProperty('--c2', SW[n].hex.knob);
    b.addEventListener('click', function () { color = n; sw.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); cur.textContent = window.colorLabel(n); if (view) view.setColor(n); setOrder(); });
    sw.appendChild(b);
  });
  sw.appendChild(cur); cur.textContent = window.colorLabel(color);
  function setOrder() { var a = document.getElementById('mOrder'); a.href = 'order.html?model=' + current + '&color=' + encodeURIComponent(color); }
  function fillCards() {
    document.querySelectorAll('[data-p]').forEach(function (el) { var p = window.productL(el.getAttribute('data-p')); if (p) el.textContent = p[el.getAttribute('data-f')]; });
    document.querySelectorAll('.product .price').forEach(function (el) { var k = el.closest('.product').getAttribute('data-model'); el.textContent = window.PRODUCTS[k].price + ' ' + window.I18N.t('cur'); });
  }
  fillCards();
  document.addEventListener('langchange', function () { fillCards(); if (current && modal.classList.contains('open')) open(current); });
  function open(key) {
    var p = window.productL(key); if (!p) return;
    current = key;
    if (!view && window.ProductView) view = window.ProductView(document.getElementById('mView'));
    if (view) { view.setColor(color); view.show(p); }
    sw.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.title === color); x.setAttribute('aria-label', window.colorLabel(x.title)); }); cur.textContent = window.colorLabel(color);
    document.getElementById('mTitle').textContent = p.name;
    document.getElementById('mPrice').textContent = p.price + ' ' + window.I18N.t('cur');
    document.getElementById('mDesc').textContent = p.desc;
    document.getElementById('mTag').textContent = p.tag;
    var tb = document.getElementById('mSpecs'); tb.innerHTML = '';
    p.specs.forEach(function (r) { var tr = document.createElement('tr'); tr.innerHTML = '<td></td><td></td>'; tr.children[0].textContent = r[0]; tr.children[1].textContent = r[1]; tb.appendChild(tr); });
    var a = document.getElementById('mOrder'); a.textContent = window.I18N.t('shop.order') + ' ' + p.name; setOrder();
    modal.classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('mClose').focus();
  }
  function close() { modal.classList.remove('open'); document.body.style.overflow = ''; if (view) view.stop(); }
  document.addEventListener('themechange', function () { if (view) setTimeout(view.retheme, 60); });
  document.querySelectorAll('.product').forEach(function (b) { b.addEventListener('click', function () { open(b.getAttribute('data-model')); }); });
  document.getElementById('mClose').addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  var want = new URLSearchParams(location.search).get('model'); if (want) open(want);
})();
</script>
</body>
</html>
