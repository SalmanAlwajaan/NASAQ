<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<link rel="stylesheet" href="css/site.css">
<style>body{margin:0}.stage{width:1200px;height:900px;position:relative}.stage canvas{width:100%;height:100%;display:block}</style>
</head><body>
<script>
/* صفحة داخلية لتوليد الصور الثابتة: _render.html?bundle=assets/salma.wasm&time=2&yaw=0.3&dir=1 */
var q=new URLSearchParams(location.search);
var d=document.createElement('div'); d.className='stage'; d.id='stage'; d.setAttribute('data-still','');
d.setAttribute('data-bundle', q.get('bundle')||'assets/parts.wasm');
['time','yaw','dir'].forEach(function(k){ if(q.get(k)!==null) d.setAttribute('data-'+k,q.get(k)); });
var bg=q.get('bg')||'#FFFFFF'; d.style.setProperty('--stage-bg',bg); d.style.background=bg; document.body.style.background=bg;
d.innerHTML='<canvas></canvas>'; document.body.appendChild(d);
</script>
<script src="js/stage.js"></script><script src="js/cinematic.js"></script></body></html>
